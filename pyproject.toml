[project]
name = "aia-business-knowledge-assistant"
version = "1.1.0"
description = "A production-minded AI knowledge assistant for small and medium businesses."
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
cache_dir = "/tmp/pytest_cache"
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["B008", "UP047"]